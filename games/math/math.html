<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6a11cb">
  <title>Math Blitz</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <link rel="stylesheet" href="math.css">
</head>
<body>

  <div class="game-header">
    <button class="back-btn" id="backBtn">←</button>
    <h1 class="game-title">🎯 Math Blitz</h1>
    <div class="header-spacer"></div>
  </div>

  <!-- START SCREEN -->
  <div id="startScreen" class="screen active">
    <div class="start-card">
      <div class="start-icon">🎯</div>
      <h2 class="start-title">Math Blitz</h2>
      <p class="start-sub">Solve as many as you can in 60s!</p>

      <div class="rules">
        <p>✅ 5 correct = Level Up</p>
        <p>⏱️ Wrong answer = -2 seconds</p>
        <p>🔥 Streak = Bonus points</p>
      </div>

      <div class="best-score-box">
        <span>🏆 Best Score</span>
        <strong id="bestScoreStart">0</strong>
      </div>

      <button id="startBtn" class="btn-play">▶ START</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="screen">
    <div class="top-bar">
      <div class="stat-box">
        <span class="stat-label">LEVEL</span>
        <span class="stat-value" id="levelDisplay">1</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">SCORE</span>
        <span class="stat-value" id="scoreDisplay">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">TIME</span>
        <span class="stat-value" id="timerDisplay">60</span>
      </div>
    </div>

    <div class="timer-bar-wrap">
      <div id="timerBar" class="timer-bar"></div>
    </div>

    <div class="question-card">
      <div id="questionText" class="question-text">2 + 2 = ?</div>
    </div>

    <div class="options-grid" id="optionsGrid">
      <button class="option-btn" data-index="0">4</button>
      <button class="option-btn" data-index="1">5</button>
      <button class="option-btn" data-index="2">3</button>
      <button class="option-btn" data-index="3">6</button>
    </div>

    <div class="streak-box">
      <span id="streakText">🔥 Streak: 0</span>
    </div>
  </div>

  <!-- GAME OVER SCREEN -->
  <div id="gameOverScreen" class="screen">
    <div class="gameover-icon">⏰</div>
    <h2 class="gameover-title">Time's Up!</h2>

    <div class="result-box">
      <div class="result-item">
        <span>Score</span>
        <strong id="finalScore">0</strong>
      </div>
      <div class="result-item">
        <span>Level Reached</span>
        <strong id="finalLevel">1</strong>
      </div>
      <div class="result-item">
        <span>Best Score</span>
        <strong id="finalBest">0</strong>
      </div>
    </div>

    <div id="newRecordBadge" class="new-record hidden">🎉 NEW RECORD! 🎉</div>

    <button id="restartBtn" class="btn-play">🔄 PLAY AGAIN</button>
    <button id="homeBtn" class="btn-secondary">🏠 BACK TO HOME</button>
  </div>

  <div id="feedback" class="feedback hidden"></div>

  <script src="math.js"></script>
</body>
</html>
